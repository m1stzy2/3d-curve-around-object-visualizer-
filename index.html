<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 方塊 + 隨機曲線</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: #0a0a12; color: #eee; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20, 22, 34, 0.9);
    border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    user-select: none; min-width: 300px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  button {
    background: #2a2e42; color: #eef;
    border: 1px solid #3a3e52;
    padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
    transition: background 0.15s;
  }
  button:hover { background: #3a3e52; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #d65a5a; border-color: #d65a5a; }
  button.primary:hover { background: #e26a6a; }
  button.warn { background: #4a2a2e; border-color: #5a3a3e; }
  button.warn:hover { background: #5a3a3e; }
  button.active { background: #d65a5a; border-color: #d65a5a; color: #fff; }
  input[type=number] {
    width: 64px; background: #1a1e30; color: #eef;
    border: 1px solid #3a3e52; border-radius: 4px;
    padding: 4px 6px; font-size: 13px;
  }
  input[type=range] { flex: 1; accent-color: #ffb060; }
  label { font-size: 12px; color: #aab; white-space: nowrap; }
  .val { font-size: 12px; color: #9aa; width: 32px; text-align: right; }
  #status { font-size: 12px; color: #9aa; padding-top: 4px; border-top: 1px solid #2a2e42; line-height: 1.6; }
  #hint {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    font-size: 12px; color: #667; line-height: 1.7;
    pointer-events: none;
    background: rgba(10, 10, 18, 0.6);
    padding: 6px 10px; border-radius: 6px;
  }
  kbd {
    display: inline-block;
    padding: 1px 5px; border-radius: 3px;
    background: #2a2e42; border: 1px solid #4a4e62;
    font-family: monospace; font-size: 11px;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="row">
    <button id="btnAdd">➕ 添加方塊</button>
    <button id="btnRand">🎲 隨機方塊</button>
  </div>
  <div class="row">
    <button id="btnDel">🗑 刪除選中</button>
    <button id="btnClear" class="warn">🧹 清空</button>
  </div>
  <div class="row">
    <button id="btnCurve" class="primary" style="flex:1">🌀 繪製隨機曲線</button>
  </div>
  <div class="row">
    <label>種子</label>
    <input id="seed" type="number" value="42" title="隨機種子">
    <span style="flex:1"></span>
  </div>
  <div class="row">
    <label>離表面</label>
    <input id="gap" type="range" min="0.01" max="0.5" step="0.01" value="0.15">
    <span id="gapVal" class="val">0.15</span>
  </div>
  <div class="row">
    <label>殼厚</label>
    <input id="shell" type="range" min="0.2" max="1.5" step="0.1" value="0.7">
    <span id="shellVal" class="val">0.7</span>
  </div>
  <div id="status">方塊: 0 | 曲線: 無</div>
</div>

<div id="hint">
  <kbd>點擊方塊</kbd> 選中 · <kbd>拖拽箭頭</kbd> 移動 · <kbd>添加模式</kbd> 下點擊地面放置<br>
  <kbd>Delete</kbd> 刪除選中 · <kbd>Esc</kbd> 取消 · <kbd>G/R/S</kbd> 平移/旋轉/縮放
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ============================================================
// 場景
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 30, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(10, 8, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.target.set(0, 1.5, 0);
orbit.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN,
};

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(6, 12, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-6, 6, -6);
scene.add(fill);

const grid = new THREE.GridHelper(60, 60, 0x333348, 0x1a1a28);
scene.add(grid);

// 地面平面（不可見，用來 raycast 放置方塊）
const groundPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
);
groundPlane.rotation.x = -Math.PI / 2;
scene.add(groundPlane);

// ============================================================
// 狀態
// ============================================================
const boxes = [];        // { mesh, radius, size }
let selected = null;
let mode = 'select';     // 'select' | 'add'
let curveGroup = null;

// ============================================================
// TransformControls
// ============================================================
const tc = new TransformControls(camera, renderer.domElement);
tc.setMode('translate');
tc.setSpace('world');
tc.setSize(0.9);
tc.addEventListener('dragging-changed', e => {
  orbit.enabled = !e.value;
});
const tcHelper = (typeof tc.getHelper === 'function') ? tc.getHelper() : tc;
scene.add(tcHelper);

// ============================================================
// 方塊
// ============================================================
function makeBox(pos, size = 1, hue = null) {
  const h = hue ?? Math.random();
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(h, 0.55, 0.55),
    transparent: true,
    opacity: 0.9,
    roughness: 0.4,
    metalness: 0.15,
    emissive: new THREE.Color(0x000000),
  });
  const geo = new THREE.BoxGeometry(size, size, size);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData.size = size;
  scene.add(mesh);
  const entry = { mesh, radius: Math.sqrt(3) * size / 2, size };
  boxes.push(entry);
  updateStatus();
  return entry;
}

function removeEntry(entry) {
  scene.remove(entry.mesh);
  entry.mesh.geometry.dispose();
  entry.mesh.material.dispose();
  const i = boxes.indexOf(entry);
  if (i >= 0) boxes.splice(i, 1);
  if (selected === entry) deselect();
  updateStatus();
}

function selectEntry(entry) {
  if (selected === entry) return;
  deselect();
  selected = entry;
  entry.mesh.material.emissive = new THREE.Color(0x445566);
  entry.mesh.material.emissiveIntensity = 1;
  tc.attach(entry.mesh);
  updateStatus();
}

function deselect() {
  if (selected) selected.mesh.material.emissive = new THREE.Color(0x000000);
  selected = null;
  tc.detach();
  updateStatus();
}

function clearBoxes() {
  for (const b of boxes) {
    scene.remove(b.mesh);
    b.mesh.geometry.dispose();
    b.mesh.material.dispose();
  }
  boxes.length = 0;
  if (selected) { selected = null; tc.detach(); }
  updateStatus();
}

// ============================================================
// 隨機工具
// ============================================================
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function randUnit(rng) {
  const u = rng() * 2 - 1;
  const th = rng() * Math.PI * 2;
  const r = Math.sqrt(1 - u * u);
  return new THREE.Vector3(r * Math.cos(th), u, r * Math.sin(th));
}

function randTangent(normal, rng) {
  for (let i = 0; i < 10; i++) {
    const a = randUnit(rng);
    const t = a.clone().addScaledVector(normal, -a.dot(normal));
    if (t.lengthSq() > 1e-6) return t.normalize();
  }
  return randUnit(rng);
}

// ============================================================
// 距離查詢
// ============================================================
function nearestBox(p) {
  if (boxes.length === 0) return null;
  let minD = Infinity, nb = null;
  for (const b of boxes) {
    const dd = p.distanceTo(b.mesh.position) - b.radius;
    if (dd < minD) { minD = dd; nb = b; }
  }
  return { box: nb, dist: minD };
}

// ============================================================
// 追加隨機方塊（每次點擊用不同種子，避免重疊）
// ============================================================
let randCounter = 0;

function addRandomBoxes(seed) {
  const rng = mulberry32(seed);
  const n = 3 + Math.floor(rng() * 4);
  for (let i = 0; i < n; i++) {
    const size = 0.6 + rng() * 2.4;
    const angle = rng() * Math.PI * 2;
    // 環形分佈：2.5 ~ 10.5，避免都擠在原點附近
    const radius = 2.5 + rng() * 8.0;
    makeBox(
      new THREE.Vector3(
        Math.cos(angle) * radius,
        size / 2 + rng() * 3.0,
        Math.sin(angle) * radius
      ),
      size
    );
  }
}

// ============================================================
// 曲線生成（貼近方塊版）
// ============================================================
function generateCurve(seed, gap, shellThick) {
  const rng = mulberry32(seed);

  let maxBoxSize = 0;
  for (const b of boxes) maxBoxSize = Math.max(maxBoxSize, b.size);
  const halfSize = 0.5 * maxBoxSize;

  // 目標距離：上限為 halfSize * 0.9，讓 0.5 在大方塊場景完整生效
  const targetGap = Math.min(gap, halfSize * 0.9);
  let effShell = Math.min(shellThick, halfSize - targetGap);
  if (effShell < 0.05) effShell = 0.05;
  const maxGap = targetGap + effShell;

  // 防穿模閾值與步長：更細，允許更貼近
  const radiusOn = Math.max(0.015, maxBoxSize * 0.025);
  const step = Math.max(0.05, maxBoxSize * 0.035);
  const eps = step * 1.8;

  const center = new THREE.Vector3();
  for (const b of boxes) center.add(b.mesh.position);
  center.divideScalar(boxes.length);

  // 起點：從某個方塊表面附近出發
  let p = null;
  for (let tries = 0; tries < 200; tries++) {
    const b = boxes[Math.floor(rng() * boxes.length)];
    const dir0 = randUnit(rng);
    const dist = b.radius + targetGap + rng() * (maxGap - targetGap) * 0.5;
    const cand = b.mesh.position.clone().addScaledVector(dir0, dist);
    if (nearestBox(cand).dist >= Math.max(radiusOn, targetGap * 0.5)) {
      p = cand;
      break;
    }
  }
  if (!p) throw new Error('找不到合法起點，請加大「離表面」或按「清空」重試');

  const visited = [p.clone()];
  let dir = randTangent(p.clone().sub(center).normalize(), rng);

  const N = 350 + Math.floor(rng() * 280);
  const skip = Math.ceil(eps / step) + 1;

  for (let i = 0; i < N; i++) {
    const radial = p.clone().sub(center).normalize();

    const nb = nearestBox(p);
    let outward = p.clone().sub(nb.box.mesh.position);
    if (outward.lengthSq() < 1e-8) outward = randUnit(rng);
    else outward.normalize();

    const radialForce = new THREE.Vector3();
    if (nb.dist < targetGap) {
      radialForce.copy(outward).multiplyScalar(3.0);   // 太近：推出去
    } else if (nb.dist > maxGap && nb.dist < maxGap * 2.5) {
      radialForce.copy(outward).multiplyScalar(-2.5);  // 太遠：拉回
    } else if (nb.dist >= targetGap && nb.dist <= maxGap) {
      // 中間：弱吸附到目標表面
      const t = (nb.dist - targetGap) / (maxGap - targetGap);
      radialForce.copy(outward).multiplyScalar(-0.4 + 0.8 * t);
    }

    let tang = dir.clone().addScaledVector(radial, -dir.dot(radial));
    if (tang.lengthSq() < 1e-8) tang = randTangent(radial, rng);
    else tang.normalize();

    const repel = new THREE.Vector3();
    const repelR = 3 * step + eps;
    const lo = Math.max(0, visited.length - skip - 40);
    const hi = visited.length - skip;
    for (let j = lo; j < hi; j++) {
      const dq = p.clone().sub(visited[j]);
      const dd = dq.length();
      if (dd > 1e-6 && dd < repelR) repel.addScaledVector(dq, 1 / (dd * dd * dd));
    }
    if (repel.lengthSq() > 1e-8) repel.normalize();

    const newDir = new THREE.Vector3()
      .addScaledVector(tang, 1.6)
      .addScaledVector(radialForce, 1.4)
      .addScaledVector(repel, 2.2)
      .addScaledVector(dir, 1.0)
      .addScaledVector(randUnit(rng), 0.35);

    if (newDir.lengthSq() < 1e-8) newDir.copy(randUnit(rng));
    else newDir.normalize();

    let ok = false;
    let cand;
    for (let t = 0; t < 30; t++) {
      cand = p.clone().addScaledVector(newDir, step);

      const nb2 = nearestBox(cand);
      if (nb2.dist < radiusOn) {
        const out2 = cand.clone().sub(nb2.box.mesh.position);
        if (out2.lengthSq() < 1e-8) out2.copy(randUnit(rng));
        else out2.normalize();
        newDir.addScaledVector(out2, 2.0).normalize();
        continue;
      }

      let dmin = Infinity;
      const lim = visited.length - skip;
      for (let j = 0; j < lim; j++) {
        const dd = cand.distanceTo(visited[j]);
        if (dd < dmin) dmin = dd;
      }
      if (dmin >= eps) { ok = true; break; }

      newDir.addScaledVector(randUnit(rng), 2.0).add(repel).normalize();
    }

    if (!ok) break;
    p.copy(cand);
    dir.copy(newDir);
    visited.push(p.clone());
  }

  generateCurve._lastInfo = { maxBoxSize, targetGap, maxGap, effShell };
  return visited;
}

// ============================================================
// 繪製 / 清除曲線
// ============================================================
function clearCurve() {
  if (curveGroup) {
    scene.remove(curveGroup);
    curveGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    curveGroup = null;
  }
  updateStatus();
}

function drawCurve(pts) {
  clearCurve();
  curveGroup = new THREE.Group();

  const geo = new THREE.BufferGeometry().setFromPoints(pts);

  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xffc860, transparent: true, opacity: 1,
  }));
  curveGroup.add(line);

  const points = new THREE.Points(geo.clone(), new THREE.PointsMaterial({
    color: 0xffe0a0, size: 0.05, sizeAttenuation: true,
  }));
  curveGroup.add(points);

  const sgeo = new THREE.SphereGeometry(0.12, 16, 16);
  const smat = new THREE.MeshBasicMaterial({ color: 0xff3366 });
  const startMesh = new THREE.Mesh(sgeo, smat);
  startMesh.position.copy(pts[0]);
  curveGroup.add(startMesh);

  scene.add(curveGroup);
  updateStatus();
}

// ============================================================
// 狀態列
// ============================================================
function updateStatus() {
  let n = 0;
  if (curveGroup) {
    const line = curveGroup.children.find(c => c.type === 'Line');
    n = line ? line.geometry.attributes.position.count : 0;
  }
  const info = generateCurve._lastInfo;
  let extra = '';
  if (info && n > 0) {
    extra = ` | 距表面 ${info.targetGap.toFixed(2)}–${info.maxGap.toFixed(2)}`;
  }
  document.getElementById('status').textContent =
    `方塊: ${boxes.length} | 曲線: ${n ? n + ' 點' : '無'}${extra}` +
    (selected ? ' | 已選中' : '');
}

// ============================================================
// 拾取
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function setMouse(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
}

function pickBox(e) {
  setMouse(e);
  const meshes = boxes.map(b => b.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const mesh = hits[0].object;
    return boxes.find(b => b.mesh === mesh) || null;
  }
  return null;
}

function pickGround(e) {
  setMouse(e);
  const hits = raycaster.intersectObject(groundPlane, false);
  return hits.length > 0 ? hits[0].point : null;
}

// ============================================================
// 指標事件
// ============================================================
let downX = 0, downY = 0, downOnTC = false;

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  downX = e.clientX; downY = e.clientY;
  setMouse(e);
  downOnTC = !!selected && raycaster.intersectObject(tcHelper, true).length > 0;
});

renderer.domElement.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 5) return;

  if (mode === 'add') {
    const hit = pickGround(e);
    if (hit) {
      const s = 1.0;
      makeBox(new THREE.Vector3(hit.x, s / 2, hit.z), s);
    }
    return;
  }

  if (downOnTC) return;

  const entry = pickBox(e);
  if (entry) selectEntry(entry);
  else deselect();
});

// ============================================================
// UI
// ============================================================
const gapEl = document.getElementById('gap');
const gapVal = document.getElementById('gapVal');
const shellEl = document.getElementById('shell');
const shellVal = document.getElementById('shellVal');
const seedEl = document.getElementById('seed');
const btnAdd = document.getElementById('btnAdd');

gapEl.addEventListener('input', () => gapVal.textContent = (+gapEl.value).toFixed(2));
shellEl.addEventListener('input', () => shellVal.textContent = (+shellEl.value).toFixed(1));

btnAdd.addEventListener('click', () => {
  if (mode === 'add') {
    mode = 'select';
    btnAdd.classList.remove('active');
  } else {
    mode = 'add';
    btnAdd.classList.add('active');
    deselect();
  }
});

document.getElementById('btnRand').addEventListener('click', () => {
  const baseSeed = (parseInt(seedEl.value, 10) || 42) >>> 0;
  // 每次點擊自動遞增，避免同位置重疊
  const s = (baseSeed * 2654435761 + (++randCounter)) >>> 0;
  addRandomBoxes(s);
});

document.getElementById('btnDel').addEventListener('click', () => {
  if (selected) removeEntry(selected);
});

document.getElementById('btnClear').addEventListener('click', () => {
  clearBoxes();
  clearCurve();
});

document.getElementById('btnCurve').addEventListener('click', () => {
  if (boxes.length === 0) {
    alert('請先添加方塊');
    return;
  }
  const seed = (parseInt(seedEl.value, 10) || 42) >>> 0;
  const gap = parseFloat(gapEl.value);
  const shell = parseFloat(shellEl.value);

  const btn = document.getElementById('btnCurve');
  btn.disabled = true;
  btn.textContent = '🌀 計算中…';

  setTimeout(() => {
    try {
      const pts = generateCurve(seed, gap, shell);
      if (pts.length < 4) throw new Error('生成點太少，請加大「殼厚」');
      drawCurve(pts);
      const info = generateCurve._lastInfo;
      console.log(`[curve] seed=${seed} gap=${gap} shell=${shell} ` +
                  `points=${pts.length} ` +
                  `maxBoxSize=${info.maxBoxSize.toFixed(2)} ` +
                  `range=[${info.targetGap.toFixed(2)}, ${info.maxGap.toFixed(2)}]`);
    } catch (err) {
      console.error(err);
      alert('生成失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🌀 繪製隨機曲線';
    }
  }, 20);
});

// ============================================================
// 鍵盤
// ============================================================
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') {
    mode = 'select';
    btnAdd.classList.remove('active');
    deselect();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selected) removeEntry(selected);
  } else if (e.key === 'g' || e.key === 'G') tc.setMode('translate');
  else if (e.key === 'r' || e.key === 'R') tc.setMode('rotate');
  else if (e.key === 's' || e.key === 'S') tc.setMode('scale');
});

// ============================================================
// 渲染
// ========================
