<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 方塊 + 隨機曲線</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: #0a0a12; color: #eee; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20, 22, 34, 0.9);
    border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    user-select: none; min-width: 290px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  button {
    background: #2a2e42; color: #eef;
    border: 1px solid #3a3e52;
    padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
    transition: background 0.15s;
  }
  button:hover { background: #3a3e52; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #d65a5a; border-color: #d65a5a; }
  button.primary:hover { background: #e26a6a; }
  button.warn { background: #4a2a2e; border-color: #5a3a3e; }
  button.warn:hover { background: #5a3a3e; }
  input[type=number] {
    width: 64px; background: #1a1e30; color: #eef;
    border: 1px solid #3a3e52; border-radius: 4px;
    padding: 4px 6px; font-size: 13px;
  }
  input[type=range] { flex: 1; accent-color: #ffb060; }
  label { font-size: 12px; color: #aab; white-space: nowrap; }
  .val { font-size: 12px; color: #9aa; width: 32px; text-align: right; }
  #status { font-size: 12px; color: #9aa; padding-top: 4px; border-top: 1px solid #2a2e42; }
  #hint {
    position: fixed; bottom: 12px; left: 12px; z-index: 10;
    font-size: 12px; color: #667; line-height: 1.7;
    pointer-events: none;
    background: rgba(10, 10, 18, 0.6);
    padding: 6px 10px; border-radius: 6px;
  }
  kbd {
    display: inline-block;
    padding: 1px 5px; border-radius: 3px;
    background: #2a2e42; border: 1px solid #4a4e62;
    font-family: monospace; font-size: 11px;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="row">
    <button id="btnRand">🎲 隨機方塊</button>
    <button id="btnClear" class="warn">🧹 清空</button>
  </div>
  <div class="row">
    <button id="btnCurve" class="primary" style="flex:1">🌀 繪製隨機曲線</button>
  </div>
  <div class="row">
    <label>種子</label>
    <input id="seed" type="number" value="42" title="隨機種子">
    <span style="flex:1"></span>
  </div>
  <div class="row">
    <label>離表面</label>
    <input id="gap" type="range" min="0.1" max="1.5" step="0.05" value="0.25">
    <span id="gapVal" class="val">0.25</span>
  </div>
  <div class="row">
    <label>殼厚</label>
    <input id="shell" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
    <span id="shellVal" class="val">1.0</span>
  </div>
  <div id="status">方塊: 0 | 曲線: 無</div>
</div>

<div id="hint">
  <kbd>左鍵拖拽</kbd> 旋轉視角 · <kbd>右鍵拖拽</kbd> 平移 · <kbd>滾輪</kbd> 縮放<br>
  <kbd>🎲</kbd> 追加隨機方塊 · <kbd>🧹</kbd> 清空所有 · <kbd>🌀</kbd> 圍繞全部方塊生成曲線
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// 場景
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 30, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(10, 8, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.target.set(0, 1.5, 0);
orbit.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN,
};

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(6, 12, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-6, 6, -6);
scene.add(fill);

const grid = new THREE.GridHelper(60, 60, 0x333348, 0x1a1a28);
scene.add(grid);

// ============================================================
// 狀態
// ============================================================
const boxes = [];        // { mesh, radius }
let curveGroup = null;

// ============================================================
// 方塊
// ============================================================
function makeBox(pos, size = 1, hue = null) {
  const h = hue ?? Math.random();
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(h, 0.55, 0.55),
    transparent: true,
    opacity: 0.9,
    roughness: 0.4,
    metalness: 0.15,
  });
  const geo = new THREE.BoxGeometry(size, size, size);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  boxes.push({ mesh, radius: Math.sqrt(3) * size / 2 });
  updateStatus();
}

function clearBoxes() {
  for (const b of boxes) {
    scene.remove(b.mesh);
    b.mesh.geometry.dispose();
    b.mesh.material.dispose();
  }
  boxes.length = 0;
  updateStatus();
}

// ============================================================
// 隨機工具
// ============================================================
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function randUnit(rng) {
  const u = rng() * 2 - 1;
  const th = rng() * Math.PI * 2;
  const r = Math.sqrt(1 - u * u);
  return new THREE.Vector3(r * Math.cos(th), u, r * Math.sin(th));
}

function randTangent(normal, rng) {
  for (let i = 0; i < 10; i++) {
    const a = randUnit(rng);
    const t = a.clone().addScaledVector(normal, -a.dot(normal));
    if (t.lengthSq() > 1e-6) return t.normalize();
  }
  return randUnit(rng);
}

// ============================================================
// 距離查詢（方塊包圍球近似）
// ============================================================
function distToObjects(p) {
  if (boxes.length === 0) return Infinity;
  let d = Infinity;
  for (const b of boxes) {
    const dist = p.distanceTo(b.mesh.position) - b.radius;
    if (dist < d) d = dist;
  }
  return d;
}

// ============================================================
// 追加隨機方塊
// ============================================================
function addRandomBoxes(seed) {
  const rng = mulberry32(seed);
  const n = 3 + Math.floor(rng() * 4);

  for (let i = 0; i < n; i++) {
    const size = 0.6 + rng() * 1.2;
    const angle = rng() * Math.PI * 2;
    const radius = 1.5 + rng() * 3.5;
    makeBox(
      new THREE.Vector3(
        Math.cos(angle) * radius,
        size / 2 + rng() * 2.0,
        Math.sin(angle) * radius
      ),
      size
    );
  }
}

// ============================================================
// 曲線生成
// ============================================================
function generateCurve(seed, gap, shellThick) {
  const rng = mulberry32(seed);

  const center = new THREE.Vector3();
  for (const b of boxes) center.add(b.mesh.position);
  center.divideScalar(boxes.length);

  let maxR = 0;
  for (const b of boxes) {
    maxR = Math.max(maxR, center.distanceTo(b.mesh.position) + b.radius);
  }

  const dMin = maxR + gap;
  const dMax = maxR + gap + shellThick;
  const step = Math.max(0.1, maxR * 0.035);
  const eps  = step * 1.8;
  const radiusOn = Math.max(0.08, maxR * 0.05);

  // 起點
  let p = null;
  for (let tries = 0; tries < 120; tries++) {
    const u = randUnit(rng);
    const target = center.clone().addScaledVector(u, (dMin + dMax) * 0.5);
    if (distToObjects(target) > radiusOn) { p = target; break; }
  }
  if (!p) throw new Error('找不到合法起點，請加大「離表面」或「殼厚」');

  const visited = [p.clone()];
  let dir = randTangent(p.clone().sub(center).normalize(), rng);

  const N = 320 + Math.floor(rng() * 260);
  const skip = Math.ceil(eps / step) + 1;

  for (let i = 0; i < N; i++) {
    const radial = p.clone().sub(center).normalize();
    const r = p.distanceTo(center);

    const radialForce = new THREE.Vector3();
    if (r < dMin) radialForce.copy(radial);
    else if (r > dMax) radialForce.copy(radial).multiplyScalar(-1);

    let tang = dir.clone().addScaledVector(radial, -dir.dot(radial));
    if (tang.lengthSq() < 1e-8) tang = randTangent(radial, rng);
    else tang.normalize();

    const repel = new THREE.Vector3();
    const repelR = 3 * step + eps;
    const lo = Math.max(0, visited.length - skip - 40);
    const hi = visited.length - skip;
    for (let j = lo; j < hi; j++) {
      const dq = p.clone().sub(visited[j]);
      const dd = dq.length();
      if (dd > 1e-6 && dd < repelR) repel.addScaledVector(dq, 1 / (dd * dd * dd));
    }
    if (repel.lengthSq() > 1e-8) repel.normalize();

    const newDir = new THREE.Vector3()
      .addScaledVector(tang, 1.0)
      .addScaledVector(radialForce, 2.0)
      .addScaledVector(repel, 2.5)
      .addScaledVector(dir, 1.5)
      .addScaledVector(randUnit(rng), 0.6);

    if (newDir.lengthSq() < 1e-8) newDir.copy(randUnit(rng));
    else newDir.normalize();

    let ok = false;
    let cand;
    for (let t = 0; t < 30; t++) {
      cand = p.clone().addScaledVector(newDir, step);

      if (distToObjects(cand) < radiusOn) {
        const out = cand.clone().sub(center).normalize();
        newDir.addScaledVector(out, 1.5).normalize();
        continue;
      }

      let dmin = Infinity;
      const lim = visited.length - skip;
      for (let j = 0; j < lim; j++) {
        const dd = cand.distanceTo(visited[j]);
        if (dd < dmin) dmin = dd;
      }
      if (dmin >= eps) { ok = true; break; }

      newDir.addScaledVector(randUnit(rng), 2.0).add(repel).normalize();
    }

    if (!ok) break;
    p.copy(cand);
    dir.copy(newDir);
    visited.push(p.clone());
  }

  return visited;
}

// ============================================================
// 繪製 / 清除曲線
// ============================================================
function clearCurve() {
  if (curveGroup) {
    scene.remove(curveGroup);
    curveGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    curveGroup = null;
  }
  updateStatus();
}

function drawCurve(pts) {
  clearCurve();
  curveGroup = new THREE.Group();

  const geo = new THREE.BufferGeometry().setFromPoints(pts);

  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xffc860, transparent: true, opacity: 1,
  }));
  curveGroup.add(line);

  const points = new THREE.Points(geo.clone(), new THREE.PointsMaterial({
    color: 0xffe0a0, size: 0.06, sizeAttenuation: true,
  }));
  curveGroup.add(points);

  const sgeo = new THREE.SphereGeometry(0.14, 16, 16);
  const smat = new THREE.MeshBasicMaterial({ color: 0xff3366 });
  const startMesh = new THREE.Mesh(sgeo, smat);
  startMesh.position.copy(pts[0]);
  curveGroup.add(startMesh);

  scene.add(curveGroup);
  updateStatus();
}

// ============================================================
// 狀態列
// ============================================================
function updateStatus() {
  let n = 0;
  if (curveGroup) {
    const line = curveGroup.children.find(c => c.type === 'Line');
    n = line ? line.geometry.attributes.position.count : 0;
  }
  document.getElementById('status').textContent =
    `方塊: ${boxes.length} | 曲線: ${n ? n + ' 點' : '無'}`;
}

// ============================================================
// UI
// ============================================================
const gapEl = document.getElementById('gap');
const gapVal = document.getElementById('gapVal');
const shellEl = document.getElementById('shell');
const shellVal = document.getElementById('shellVal');
const seedEl = document.getElementById('seed');

gapEl.addEventListener('input', () => gapVal.textContent = (+gapEl.value).toFixed(2));
shellEl.addEventListener('input', () => shellVal.textContent = (+shellEl.value).toFixed(1));

// 🎲 追加隨機方塊（不清空）
document.getElementById('btnRand').addEventListener('click', () => {
  const s = (parseInt(seedEl.value, 10) || 42) >>> 0;
  addRandomBoxes(s);
});

// 🧹 清空全部
document.getElementById('btnClear').addEventListener('click', () => {
  clearBoxes();
  clearCurve();
});

// 🌀 繪製曲線
document.getElementById('btnCurve').addEventListener('click', () => {
  if (boxes.length === 0) {
    alert('請先按「🎲 隨機方塊」生成方塊');
    return;
  }
  const seed = (parseInt(seedEl.value, 10) || 42) >>> 0;
  const gap = parseFloat(gapEl.value);
  const shell = parseFloat(shellEl.value);

  const btn = document.getElementById('btnCurve');
  btn.disabled = true;
  btn.textContent = '🌀 計算中…';

  setTimeout(() => {
    try {
      const pts = generateCurve(seed, gap, shell);
      if (pts.length < 4) throw new Error('生成點太少，請加大「殼厚」');
      drawCurve(pts);
      console.log(`[curve] seed=${seed} gap=${gap} shell=${shell} points=${pts.length}`);
    } catch (err) {
      console.error(err);
      alert('生成失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🌀 繪製隨機曲線';
    }
  }, 20);
});

// ============================================================
// 渲染
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// 初始場景：先放一批方塊
// ============================================================
addRandomBoxes(42);
</script>

</body>
</html>
